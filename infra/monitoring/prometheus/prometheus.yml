# Prometheus Configuration for Voice Bot Platform
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "gateway-service"
    static_configs:
      - targets: ["gateway-service:8000"]
    metrics_path: /metrics

  - job_name: "orchestrator-service"
    static_configs:
      - targets: ["orchestrator-service:8001"]
    metrics_path: /metrics

  - job_name: "stt-service"
    static_configs:
      - targets: ["stt-service:8002"]
    metrics_path: /metrics

  - job_name: "llm-service"
    static_configs:
      - targets: ["llm-service:8003"]
    metrics_path: /metrics

  - job_name: "tts-service"
    static_configs:
      - targets: ["tts-service:8004"]
    metrics_path: /metrics

  - job_name: "memory-service"
    static_configs:
      - targets: ["memory-service:8005"]
    metrics_path: /metrics

  - job_name: "guardrail-service"
    static_configs:
      - targets: ["guardrail-service:8006"]
    metrics_path: /metrics

  - job_name: "media-service"
    static_configs:
      - targets: ["media-service:8007"]
    metrics_path: /metrics
